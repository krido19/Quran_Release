name: Keep Database Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Runs every 3 days at 00:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ping Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set."
            echo "Please go to Settings > Secrets and variables > Actions in your repository and add DATABASE_URL."
            exit 1
          fi
          psql "$DATABASE_URL" -c "SELECT 1;"
